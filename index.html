        .theme-toggle:hover {
            background: var(--theme-toggle-hover-bg);
            color: var(--theme-toggle-icon);
        }

        .theme-toggle svg {
            width: 17px;
            height: 17px;
            color: inherit;
        }

        .theme-toggle .icon-moon path {
            fill: currentColor;
            stroke: none;
        }

        .theme-toggle .icon-sun path {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .theme-toggle .icon-sun { display: none; }
        .theme-toggle .icon-moon { display: block; }

        [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
        [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
    </style>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            } catch (e) {}
        })();
    </script>
</head>
<body>

    <div class="app-container" role="main">
        <header class="header">
            <div class="brand-logo">
                <div class="logo-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 7.2c4.8-.5 10.2.4 15.2.1"/>
                        <path d="M4 12c3.9.45 7.8-.25 12 .15"/>
                        <path d="M4 16.8c5.1.35 10.4-.3 14.8.2"/>
                    </svg>
                </div>
                <div class="header-title">
                    <h1>Siyyaq Studio</h1>
                    <p>From messy paste to polished output</p>
                </div>
            </div>
            <div class="header-actions">
                <label class="control-label" for="presetSelect">Template</label>
                <select id="presetSelect" class="preset-select" aria-label="Formatting template" onchange="onPresetChange()">
                    <option value="default" selected>Default</option>
                    <option value="report">Official Report</option>
                    <option value="social">Social Media</option>
                    <option value="codedoc">Code Documentation</option>
                </select>
                <button type="button" id="themeToggle" class="theme-toggle" onclick="toggleTheme()" aria-label="Switch to dark mode" title="Dark mode">
                    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.25"/><path d="M12 2.75v2.5M12 18.75v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.75 12h2.5M18.75 12h2.5M4.2 19.8l1.8-1.8M18 6l1.8-1.8"/></svg>
                </button>
                <button type="button" class="btn-primary" id="processBtn" onclick="processText()" aria-label="Process and format the input text" title="Process (Ctrl/⌘ + Enter)" disabled>Process Text</button>
            </div>
        </header>

        <div class="workspace" id="workspace">
            <!-- Left Panel (Raw Input) -->
            <section class="panel left-panel" id="leftPanel" aria-label="Raw Input Section">
                <div class="panel-header">
                    <span class="section-title">Raw Input</span>
                </div>
                <div class="metrics-panel" id="metricsBar" aria-live="polite">
                    <div class="metric-item">
                        <span class="metric-label">Words</span>
                        <span class="metric-value" id="metricWords">0</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">Chars</span>
                        <span class="metric-value" id="metricChars">0</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">Lines</span>
                        <span class="metric-value" id="metricLines">0</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">Size</span>
                        <span class="metric-value" id="metricBytes">0 B</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">Read</span>
                        <span class="metric-value" id="metricRead">—</span>
                    </div>
                </div>
                <textarea id="inputText" aria-label="Input mixed text box" placeholder="Paste mixed Arabic/English text here. Code blocks stay as-is in place…&#10;&#10;Tip: Ctrl/⌘ + Enter to process" oninput="onInputChange()"></textarea>
                <div class="actions">
                    <button type="button" id="pasteBtn" onclick="pasteFromClipboard()" aria-label="Paste from clipboard">Paste</button>
                    <button type="button" id="clearBtn" onclick="clearText()" aria-label="Clear input text" disabled>Clear</button>
                    <span class="shortcut-hint" aria-hidden="true">Ctrl/⌘ + Enter</span>
                </div>
            </section>

            <!-- Slider / Resizer -->
            <div class="resizer" id="dragMe" role="separator" aria-label="Resize panels">
                <div class="resizer-handle"></div>
            </div>

            <!-- Right Panel (Organized Output) -->
            <section class="panel right-panel" aria-label="Organized Output Section">
                <div class="panel-header output-panel-header">
                    <span class="section-title">Organized Output</span>
                    <div class="output-header-controls">
                        <label class="control-label" for="dirSelect">Dir</label>
                        <select id="dirSelect" class="preset-select dir-select" aria-label="Output text direction" onchange="onDirectionChange()">
                            <option value="rtl" selected>RTL</option>
                            <option value="ltr">LTR</option>
                        </select>
                        <label class="control-label" for="fontSelect">Font</label>
                        <select id="fontSelect" class="preset-select font-select" aria-label="Output font" onchange="onFontChange()">
                            <option value="cairo" selected>Cairo — Balanced</option>
                            <option value="tajawal">Tajawal — Modern</option>
                            <option value="almarai">Almarai — Corporate</option>
                            <option value="noto">Noto Sans — Universal</option>
                            <option value="ibm">IBM Plex — Technical</option>
                            <option value="readex">Readex Pro — Bilingual</option>
                            <option value="amiri">Amiri — Formal Report</option>
                            <option value="elmessiri">El Messiri — Elegant</option>
                            <option value="changa">Changa — Bold Social</option>
                            <option value="markazi">Markazi Text — Classic</option>
                        </select>
                        <label class="control-label" for="copyFormatSelect">Copy</label>
                        <select id="copyFormatSelect" class="preset-select copy-select" aria-label="Copy format" onchange="onCopyFormatChange()">
                            <option value="plain" selected>Plain</option>
                            <option value="markdown">Markdown</option>
                            <option value="html">HTML</option>
                            <option value="whatsapp">WhatsApp</option>
                        </select>
                        <button type="button" id="editOutputBtn" style="padding: 4px 10px;" onclick="toggleOutputEdit()" aria-label="Edit organized output" disabled>Edit</button>
                        <button type="button" id="copyBtn" style="padding: 4px 10px;" onclick="copyText()" aria-label="Copy organized text" title="Copy (Ctrl/⌘ + Shift + C)" disabled>Copy</button>
                    </div>
                </div>
                <div class="output-style-bar" aria-label="Output style controls">
                    <div class="style-control">
                        <label class="control-label" for="fontSizeRange">Size</label>
                        <input type="range" id="fontSizeRange" min="13" max="22" step="0.5" value="15.5" oninput="onOutputStyleChange()">
                        <span class="style-value" id="fontSizeValue">15.5</span>
                    </div>
                    <div class="style-control">
                        <label class="control-label" for="lineHeightRange">Line</label>
                        <input type="range" id="lineHeightRange" min="1.4" max="2.4" step="0.05" value="1.85" oninput="onOutputStyleChange()">
                        <span class="style-value" id="lineHeightValue">1.85</span>
                    </div>
                    <div class="style-control">
                        <label class="control-label" for="paraGapRange">Gap</label>
                        <input type="range" id="paraGapRange" min="4" max="28" step="1" value="10" oninput="onOutputStyleChange()">
                        <span class="style-value" id="paraGapValue">10</span>
                    </div>
                </div>
                <div id="outputText" class="output-box" data-font="cairo" data-dir="rtl" aria-live="polite">
                    <div class="placeholder">Structured text will appear here...</div>
                </div>
            </section>
        </div>
    </div>

    <div id="toast" class="toast" role="status">Copied Successfully!</div>

    <script>
        // App functions first so onclick handlers always work even if later setup fails
        var currentPreset = 'default';
        var outputEditMode = false;

        function hasOutputContent() {
            var outputBox = document.getElementById('outputText');
            return outputBox && !outputBox.querySelector('.placeholder');
        }

        function updateEditButtonState() {
            var editBtn = document.getElementById('editOutputBtn');
            if (!editBtn) return;
            editBtn.disabled = !hasOutputContent();
        }

        function setOutputEditMode(enabled) {
            var outputBox = document.getElementById('outputText');
            var editBtn = document.getElementById('editOutputBtn');
            if (!outputBox) return;

            if (enabled && !hasOutputContent()) {
                showToast('Process text first');
                return;
            }

            outputEditMode = enabled;

            if (enabled) {
                outputBox.setAttribute('contenteditable', 'true');
                outputBox.classList.add('is-editing');
                if (editBtn) {
                    editBtn.textContent = 'Done';
                    editBtn.setAttribute('aria-label', 'Finish editing output');
                }
                outputBox.focus();
            } else {
                outputBox.removeAttribute('contenteditable');
                outputBox.classList.remove('is-editing');
                if (editBtn) {
                    editBtn.textContent = 'Edit';
                    editBtn.setAttribute('aria-label', 'Edit organized output');
                }
            }
        }

        function toggleOutputEdit() {
            setOutputEditMode(!outputEditMode);
        }

        function initOutputEdit() {
            var outputBox = document.getElementById('outputText');
            if (!outputBox) return;

            outputBox.addEventListener('paste', function (e) {
                if (!outputEditMode) return;
                e.preventDefault();
                var text = (e.clipboardData || window.clipboardData).getData('text/plain');
                document.execCommand('insertText', false, text);
            });

            updateEditButtonState();
        }

        function getTheme() {
            return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }

            var toggle = document.getElementById('themeToggle');
            if (toggle) {
                var label = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
                toggle.setAttribute('aria-label', label);
                toggle.title = theme === 'dark' ? 'Light mode' : 'Dark mode';
            }

            try {
                localStorage.setItem('theme', theme);
                saveStudioDefaults();
            } catch (e) {}
        }

        function toggleTheme() {
            applyTheme(getTheme() === 'dark' ? 'light' : 'dark');
        }

        var TEMPLATE_STYLES = {
            default: { fontSize: 15.5, lineHeight: 1.85, paraGap: 10 },
            report: { fontSize: 16.5, lineHeight: 2.05, paraGap: 18 },
            social: { fontSize: 17, lineHeight: 1.7, paraGap: 12 },
            codedoc: { fontSize: 15, lineHeight: 1.8, paraGap: 12 }
        };

        var PRESETS = {
            default: {
                preprocess: function (text) {
                    return text
                        .replace(/\u00A0/g, ' ')
                        .replace(/[ \t]+$/gm, '')
                        .replace(/\n{3,}/g, '\n\n');
                }
            },
            report: {
                preprocess: function (text) {
                    return text
                        .replace(/\u00A0/g, ' ')
                        .replace(/[ \t]+$/gm, '')
                        .replace(/\n{3,}/g, '\n\n')
                        .replace(/([.?!…])([ \t]*\n)(?!\n)/g, '$1\n\n');
                }
            },
            social: {
                preprocess: function (text) {
                    return text
                        .replace(/\u00A0/g, ' ')
                        .replace(/[ \t]+$/gm, '')
                        .replace(/\n{3,}/g, '\n\n');
                }
            },
            codedoc: {
                preprocess: function (text) {
                    return text
                        .replace(/\u00A0/g, ' ')
                        .replace(/[ \t]+$/gm, '')
                        .replace(/\n{3,}/g, '\n\n');
                }
            }
        };

        function getPreset() {
            var select = document.getElementById('presetSelect');
            return select ? select.value : 'default';
        }

        function onPresetChange() {
            currentPreset = getPreset();
            try { localStorage.setItem('outputPreset', currentPreset); } catch (e) {}
            applyTemplateStyleDefaults(currentPreset, false);
            saveStudioDefaults();
            var inputEl = document.getElementById('inputText');
            if (inputEl && inputEl.value.trim()) processText({ silentEmpty: true });
        }

        function initPreset() {
            var saved = 'default';
            try { saved = localStorage.getItem('outputPreset') || 'default'; } catch (e) {}
            if (!PRESETS[saved]) saved = 'default';
            var select = document.getElementById('presetSelect');
            if (select) select.value = saved;
            currentPreset = saved;
        }

        function countWords(text) {
            var normalized = text.trim();
            if (!normalized) return 0;
            var matches = normalized.match(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]+|[A-Za-z0-9][A-Za-z0-9_'-]*/g);
            return matches ? matches.length : 0;
        }

        function countLines(text) {
            if (!text) return 0;
            return text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').length;
        }

        function countChars(text) {
            return text.length;
        }

        function countCharsNoSpaces(text) {
            return text.replace(/\s/g, '').length;
        }

        function byteSize(text) {
            try {
                return new TextEncoder().encode(text).length;
            } catch (e) {
                return text.length;
            }
        }

        function formatBytes(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function estimateReadingTime(words, text) {
            if (!words) return '—';
            var arabicChars = (text.match(/[\u0600-\u06FF]/g) || []).length;
            var latinChars = (text.match(/[A-Za-z]/g) || []).length;
            var wpm = arabicChars > latinChars ? 170 : 210;
            var minutes = words / wpm;
            if (minutes < 0.5) return '< 1 min';
            if (minutes < 1.5) return '~1 min';
            return '~' + Math.round(minutes) + ' min';
        }

        function updateMetrics() {
            var inputEl = document.getElementById('inputText');
            var text = inputEl ? inputEl.value : '';
            var words = countWords(text);
            var chars = countChars(text);
            var charsNoSpaces = countCharsNoSpaces(text);
            var lines = countLines(text);
            var bytes = byteSize(text);

            var wordsEl = document.getElementById('metricWords');
            var charsEl = document.getElementById('metricChars');
            var linesEl = document.getElementById('metricLines');
            var bytesEl = document.getElementById('metricBytes');
            var readEl = document.getElementById('metricRead');

            if (wordsEl) wordsEl.textContent = words.toLocaleString();
            if (charsEl) {
                charsEl.textContent = chars.toLocaleString();
                charsEl.title = 'With spaces: ' + chars.toLocaleString() + ' | Without spaces: ' + charsNoSpaces.toLocaleString();
            }
            if (linesEl) linesEl.textContent = lines.toLocaleString();
            if (bytesEl) bytesEl.textContent = formatBytes(bytes);
            if (readEl) readEl.textContent = estimateReadingTime(words, text);

            updateActionStates();
        }

        function updateActionStates() {
            var inputEl = document.getElementById('inputText');
            var hasInput = !!(inputEl && inputEl.value.trim());
            var hasOutput = hasOutputContent();

            var processBtn = document.getElementById('processBtn');
            var clearBtn = document.getElementById('clearBtn');
            var copyBtn = document.getElementById('copyBtn');

            if (processBtn) processBtn.disabled = !hasInput;
            if (clearBtn) clearBtn.disabled = !hasInput && !hasOutput;
            if (copyBtn) copyBtn.disabled = !hasOutput;
            updateEditButtonState();
        }

        function onInputChange() {
            updateMetrics();
        }

        function applyOutputPresetClass(outputBox, preset) {
            var fontKey = outputBox.getAttribute('data-font') || 'cairo';
            var dirKey = outputBox.getAttribute('data-dir') || 'rtl';
            outputBox.className = 'output-box';
            if (outputEditMode) outputBox.classList.add('is-editing');
            outputBox.setAttribute('data-font', fontKey);
            outputBox.setAttribute('data-dir', dirKey);
            if (preset && preset !== 'default') {
                outputBox.classList.add('preset-' + preset);
            }
        }

        function getOutputDirection() {
            var select = document.getElementById('dirSelect');
            var outputBox = document.getElementById('outputText');
            if (select && (select.value === 'rtl' || select.value === 'ltr')) return select.value;
            if (outputBox && outputBox.getAttribute('data-dir') === 'ltr') return 'ltr';
            return 'rtl';
        }

        function applyOutputDirection(dirKey) {
            if (dirKey !== 'ltr' && dirKey !== 'rtl') dirKey = 'rtl';
            var outputBox = document.getElementById('outputText');
            if (outputBox) {
                outputBox.setAttribute('data-dir', dirKey);
                outputBox.setAttribute('dir', dirKey);
            }
            try {
                localStorage.setItem('outputDir', dirKey);
                saveStudioDefaults();
            } catch (e) {}
        }

        function onDirectionChange() {
            var select = document.getElementById('dirSelect');
            var dirKey = select ? select.value : 'rtl';
            applyOutputDirection(dirKey);

            var inputEl = document.getElementById('inputText');
            if (inputEl && inputEl.value.trim() && hasOutputContent()) {
                processText();
            }
        }

        function initOutputDirection() {
            var saved = 'rtl';
            try {
                saved = localStorage.getItem('outputDir') || 'rtl';
            } catch (e) {}
            if (saved !== 'ltr' && saved !== 'rtl') saved = 'rtl';
            var select = document.getElementById('dirSelect');
            if (select) select.value = saved;
            applyOutputDirection(saved);
        }

        function getOutputStyleState() {
            var sizeEl = document.getElementById('fontSizeRange');
            var lineEl = document.getElementById('lineHeightRange');
            var gapEl = document.getElementById('paraGapRange');
            return {
                fontSize: sizeEl ? parseFloat(sizeEl.value) : 15.5,
                lineHeight: lineEl ? parseFloat(lineEl.value) : 1.85,
                paraGap: gapEl ? parseFloat(gapEl.value) : 10
            };
        }

        function applyOutputStyle(style, persist) {
            style = style || getOutputStyleState();
            var fontSize = Math.min(22, Math.max(13, Number(style.fontSize) || 15.5));
            var lineHeight = Math.min(2.4, Math.max(1.4, Number(style.lineHeight) || 1.85));
            var paraGap = Math.min(28, Math.max(4, Number(style.paraGap) || 10));

            var root = document.documentElement;
            root.style.setProperty('--out-font-size', fontSize + 'px');
            root.style.setProperty('--out-line-height', String(lineHeight));
            root.style.setProperty('--out-para-gap', paraGap + 'px');

            var sizeEl = document.getElementById('fontSizeRange');
            var lineEl = document.getElementById('lineHeightRange');
            var gapEl = document.getElementById('paraGapRange');
            var sizeVal = document.getElementById('fontSizeValue');
            var lineVal = document.getElementById('lineHeightValue');
            var gapVal = document.getElementById('paraGapValue');

            if (sizeEl) sizeEl.value = String(fontSize);
            if (lineEl) lineEl.value = String(lineHeight);
            if (gapEl) gapEl.value = String(paraGap);
            if (sizeVal) sizeVal.textContent = fontSize % 1 === 0 ? String(fontSize) : fontSize.toFixed(1);
            if (lineVal) lineVal.textContent = lineHeight.toFixed(2).replace(/0$/, '').replace(/\.$/, '');
            if (gapVal) gapVal.textContent = String(Math.round(paraGap));

            if (persist !== false) {
                try {
                    localStorage.setItem('outFontSize', String(fontSize));
                    localStorage.setItem('outLineHeight', String(lineHeight));
                    localStorage.setItem('outParaGap', String(paraGap));
                    saveStudioDefaults();
                } catch (e) {}
            }
        }

        function onOutputStyleChange() {
            applyOutputStyle(getOutputStyleState(), true);
        }

        function applyTemplateStyleDefaults(preset, persist) {
            var style = TEMPLATE_STYLES[preset] || TEMPLATE_STYLES.default;
            applyOutputStyle(style, persist !== false);
        }

        function initOutputStyle() {
            var style = Object.assign({}, TEMPLATE_STYLES.default);
            try {
                var fs = localStorage.getItem('outFontSize');
                var lh = localStorage.getItem('outLineHeight');
                var pg = localStorage.getItem('outParaGap');
                if (fs) style.fontSize = parseFloat(fs);
                if (lh) style.lineHeight = parseFloat(lh);
                if (pg) style.paraGap = parseFloat(pg);
            } catch (e) {}
            applyOutputStyle(style, false);
        }

        function saveStudioDefaults() {
            try {
                var payload = {
                    theme: getTheme(),
                    outputFont: (document.getElementById('fontSelect') || {}).value || 'cairo',
                    outputDir: getOutputDirection(),
                    outputPreset: getPreset(),
                    copyFormat: getCopyFormat(),
                    style: getOutputStyleState()
                };
                localStorage.setItem('siyyaqDefaults', JSON.stringify(payload));
            } catch (e) {}
        }

        var OUTPUT_FONTS = {
            cairo: { google: 'Cairo:wght@400;500;600;700' },
            tajawal: { google: 'Tajawal:wght@400;500;700' },
            almarai: { google: 'Almarai:wght@300;400;700;800' },
            noto: { google: 'Noto+Sans+Arabic:wght@400;500;600;700' },
            ibm: { google: 'IBM+Plex+Sans+Arabic:wght@400;500;600;700' },
            readex: { google: 'Readex+Pro:wght@400;500;600;700' },
            amiri: { google: 'Amiri:wght@400;700' },
            elmessiri: { google: 'El+Messiri:wght@400;500;600;700' },
            changa: { google: 'Changa:wght@400;500;600;700' },
            markazi: { google: 'Markazi+Text:wght@400;500;600;700' }
        };

        var loadedOutputFonts = { cairo: true };

        function loadOutputFont(fontKey) {
            if (!OUTPUT_FONTS[fontKey] || loadedOutputFonts[fontKey]) return;
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'https://fonts.googleapis.com/css2?family=' + OUTPUT_FONTS[fontKey].google + '&display=swap';
            document.head.appendChild(link);
            loadedOutputFonts[fontKey] = true;
        }

        function applyOutputFont(fontKey) {
            if (!OUTPUT_FONTS[fontKey]) fontKey = 'cairo';
            loadOutputFont(fontKey);
            var outputBox = document.getElementById('outputText');
            if (outputBox) outputBox.setAttribute('data-font', fontKey);
            try {
                localStorage.setItem('outputFont', fontKey);
                saveStudioDefaults();
            } catch (e) {}
        }

        function onFontChange() {
            var select = document.getElementById('fontSelect');
            applyOutputFont(select ? select.value : 'cairo');
        }

        function initOutputFont() {
            var saved = 'cairo';
            try {
                saved = localStorage.getItem('outputFont') || 'cairo';
            } catch (e) {}
            if (!OUTPUT_FONTS[saved]) saved = 'cairo';
            var select = document.getElementById('fontSelect');
            if (select) select.value = saved;
            applyOutputFont(saved);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function looksLikeCodeLine(line) {
            var t = line.trim();
            if (!t) return false;
            if (/^(```|~~~)/.test(t)) return true;
            if (/^(<!--|<!DOCTYPE|<\/?[a-zA-Z][\w:-]*)/i.test(t)) return true;
            if (/^[{}\[\]();]+$/.test(t)) return true;
            if (/^(function|const|let|var|import|export|class|return|if|else|for|while|package)\b/.test(t)) return true;
            if (/[{};]|=>|<\/?[a-zA-Z]/.test(t) && !/[\u0600-\u06FF]/.test(t)) return true;
            return false;
        }

        function isProseLine(line) {
            var t = line.trim();
            if (!t) return false;
            if (/[\u0600-\u06FF]/.test(t) && !/^(<!--|<\/?[a-zA-Z]|`{3}|~{3})/.test(t)) return true;
            if (/^[A-Za-z].*[.!?]$/.test(t) && !looksLikeCodeLine(t) && t.split(/\s+/).length > 4) return true;
            return false;
        }

        function isLanguageLabel(line) {
            return /^(HTML|CSS|JS|JavaScript|TypeScript|TS|JSON|XML|Python|Bash|Shell|SQL|PHP|C\+\+|C#|Java|Go|Rust|Swift|Kotlin)$/i.test(line.trim());
        }

        function tokenizeMixedContent(input) {
            var lines = input.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
            var segments = [];
            var i = 0;

            while (i < lines.length) {
                var startI = i;
                var line = lines[i];
                var trimmed = line.trim();

                var fenceMatch = trimmed.match(/^(```|~~~)(\S*)\s*$/);
                if (fenceMatch) {
                    var fence = fenceMatch[1];
                    var lang = fenceMatch[2] || '';
                    i++;
                    var codeLines = [];
                    while (i < lines.length && lines[i].trim() !== fence) {
                        codeLines.push(lines[i]);
                        i++;
                    }
                    if (i < lines.length) i++;
                    segments.push({ type: 'code', lang: lang, content: codeLines.join('\n') });
                    continue;
                }

                if (isLanguageLabel(trimmed) && i + 1 < lines.length && looksLikeCodeLine(lines[i + 1])) {
                    var labeledLang = trimmed;
                    i++;
                    var labeledCode = [];
                    while (i < lines.length && !isProseLine(lines[i])) {
                        labeledCode.push(lines[i]);
                        i++;
                    }
                    while (labeledCode.length && labeledCode[labeledCode.length - 1].trim() === '') labeledCode.pop();
                    if (labeledCode.length) {
                        segments.push({ type: 'code', lang: labeledLang, content: labeledCode.join('\n') });
                        continue;
                    }
                    segments.push({ type: 'prose', content: labeledLang });
                    continue;
                }

                if (/^\s*(<!--|<!DOCTYPE\b|<(script|style|html|head|body|div|pre|code)\b)/i.test(line)) {
                    var htmlCode = [];
                    while (i < lines.length && !isProseLine(lines[i])) {
                        htmlCode.push(lines[i]);
                        i++;
                    }
                    while (htmlCode.length && htmlCode[htmlCode.length - 1].trim() === '') htmlCode.pop();
                    segments.push({ type: 'code', lang: '', content: htmlCode.join('\n') });
                    continue;
                }

                var proseLines = [];
                while (i < lines.length) {
                    var next = lines[i];
                    var nextTrim = next.trim();
                    if (/^(```|~~~)\S*\s*$/.test(nextTrim)) break;
                    if (isLanguageLabel(nextTrim) && i + 1 < lines.length && looksLikeCodeLine(lines[i + 1])) break;
                    if (/^\s*(<!--|<!DOCTYPE\b|<(script|style|html|head|body)\b)/i.test(next)) break;
                    proseLines.push(next);
                    i++;
                }
                if (proseLines.length) {
                    segments.push({ type: 'prose', content: proseLines.join('\n') });
                }

                if (i === startI) {
                    segments.push({ type: 'prose', content: line });
                    i++;
                }
            }

            return segments;
        }

        function applyRtlMarks(text) {
            return String(text)
                .replace(/([.?!…،؛:])(\s|$)/g, '$1\u200F$2')
                .replace(/(\d+)([^\d\u200E\u200F])/g, '$1\u200E$2');
        }

        function joinSoftLineBreaks(text) {
            return String(text)
                .replace(/\r\n/g, '\n')
                .replace(/\r/g, '\n')
                .replace(/[ \t]+\n/g, '\n')
                .replace(/([^\n])\n(?!\n)/g, '$1 ')
                .replace(/[ \t]{2,}/g, ' ')
                .trim();
        }

        function formatInlineCode(text, options) {
            options = options || {};
            var parts = text.split(/(`[^`\n]+`)/g);
            var isRtl = getOutputDirection() !== 'ltr';
            return parts.map(function (part) {
                if (part.length >= 2 && part.startsWith('`') && part.endsWith('`')) {
                    return '<code class="inline-code">' + escapeHtml(part.slice(1, -1)) + '</code>';
                }
                var plain = isRtl ? applyRtlMarks(part) : part;
                var escaped = escapeHtml(plain);
                if (options.social) {
                    return escaped.replace(/(^|\s)(#[\w\u0600-\u06FF_]+)/g, '$1<span class="hashtag">$2</span>');
                }
                return escaped;
            }).join('');
        }

        function renderCodeBlock(lang, content) {
            var langLabel = lang ? '<span class="code-lang">' + escapeHtml(lang) + '</span>' : '';
            return '<pre class="code-block" dir="ltr">' + langLabel + '<code>' + escapeHtml(content) + '</code></pre>';
        }

        function renderProse(content, preset) {
            preset = preset || 'default';
            var normalized = joinSoftLineBreaks(content);
            if (!normalized) return '';

            var paragraphs = normalized.split(/\n{2,}/).map(function (p) {
                return p.replace(/\s+/g, ' ').trim();
            }).filter(Boolean);

            var html = '';

            paragraphs.forEach(function (para) {
                if (preset === 'social') {
                    var sentences = para.split(/(?<=[.?!…])\s+/).filter(Boolean);
                    if (sentences.length <= 1) {
                        html += '<p>' + formatInlineCode(para, { social: true }) + '</p>';
                    } else {
                        sentences.forEach(function (sentence) {
                            html += '<p>' + formatInlineCode(sentence, { social: true }) + '</p>';
                        });
                    }
                    return;
                }

                if (preset === 'report') {
                    html += '<p>' + formatInlineCode(para) + '</p>';
                    return;
                }

                if (preset === 'codedoc') {
                    if (/^#{1,3}\s+/.test(para)) {
                        var heading = para.replace(/^#{1,3}\s+/, '');
                        html += '<p><strong>' + formatInlineCode(heading) + '</strong></p>';
                    } else {
                        html += '<p>' + formatInlineCode(para) + '</p>';
                    }
                    return;
                }

                html += '<p>' + formatInlineCode(para) + '</p>';
            });

            return html;
        }

        function fallbackFormat(input) {
            var joined = joinSoftLineBreaks(input);
            var formatted = getOutputDirection() === 'ltr' ? joined : applyRtlMarks(joined);
            return formatted
                .split(/\n{2,}/)
                .map(function (p) { return p.replace(/\s+/g, ' ').trim(); })
                .filter(Boolean)
                .map(function (p) { return '<p>' + escapeHtml(p) + '</p>'; })
                .join('');
        }

        var toastTimer = null;

        function showToast(msg) {
            var toast = document.getElementById('toast');
            if (!toast) return;
            toast.innerText = msg;
            toast.style.display = 'block';
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function () {
                toast.style.display = 'none';
                toastTimer = null;
            }, 2000);
        }

        function flashOutput() {
            var outputBox = document.getElementById('outputText');
            if (!outputBox || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            outputBox.classList.remove('just-updated');
            void outputBox.offsetWidth;
            outputBox.classList.add('just-updated');
            setTimeout(function () {
                outputBox.classList.remove('just-updated');
            }, 500);
        }

        function processText(options) {
            options = options || {};
            var inputEl = document.getElementById('inputText');
            var outputBox = document.getElementById('outputText');
            if (!outputBox) return;

            setOutputEditMode(false);

            var input = inputEl ? inputEl.value : '';
            var preset = getPreset();
            currentPreset = preset;

            updateMetrics();

            if (!input.trim()) {
                applyOutputPresetClass(outputBox, 'default');
                outputBox.innerHTML = '<div class="placeholder">Please insert text first...</div>';
                updateActionStates();
                if (!options.silentEmpty) showToast('Paste text first');
                return;
            }

            applyOutputPresetClass(outputBox, preset);

            var processedInput = input;
            if (PRESETS[preset] && PRESETS[preset].preprocess) {
                processedInput = PRESETS[preset].preprocess(input);
            }

            try {
                var segments = tokenizeMixedContent(processedInput);
                var htmlOutput = '';
                segments.forEach(function (seg) {
                    if (seg.type === 'code') htmlOutput += renderCodeBlock(seg.lang, seg.content);
                    else htmlOutput += renderProse(seg.content, preset);
                });
                outputBox.innerHTML = htmlOutput || fallbackFormat(processedInput);
            } catch (err) {
                console.error(err);
                outputBox.innerHTML = fallbackFormat(processedInput);
                showToast('Processed with basic formatter');
                updateActionStates();
                return;
            }

            updateActionStates();
            flashOutput();
            if (options.silentToast) return;
            if (options.fromPaste) showToast('Formatted');
            else if (options.fromShortcut) showToast('Done');
        }

        function clearText() {
            var inputEl = document.getElementById('inputText');
            var outputBox = document.getElementById('outputText');
            var hasContent = (inputEl && inputEl.value.trim()) || hasOutputContent();
            if (!hasContent) return;

            setOutputEditMode(false);
            if (inputEl) inputEl.value = '';
            if (outputBox) {
                applyOutputPresetClass(outputBox, 'default');
                outputBox.innerHTML = '<div class="placeholder">Structured text will appear here...</div>';
            }
            updateMetrics();
            updateActionStates();
            if (inputEl) inputEl.focus();
        }

        function pasteFromClipboard() {
            var inputEl = document.getElementById('inputText');
            if (!inputEl) return;

            function applyPasted(text) {
                if (!text) {
                    showToast('Clipboard is empty');
                    return;
                }
                inputEl.value = text;
                updateMetrics();
                processText({ fromPaste: true });
                inputEl.focus();
            }

            if (navigator.clipboard && navigator.clipboard.readText) {
                navigator.clipboard.readText().then(applyPasted).catch(function () {
                    showToast('Allow clipboard access to paste');
                    inputEl.focus();
                });
            } else {
                showToast('Use Ctrl/⌘ + V to paste');
                inputEl.focus();
            }
        }

        function fallbackCopy(text) {
            var ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showToast('Text Copied!');
            } catch (e) {
                showToast('Copy failed');
            }
            document.body.removeChild(ta);
        }

        function getCopyFormat() {
            var select = document.getElementById('copyFormatSelect');
            var value = select ? select.value : 'plain';
            if (value !== 'plain' && value !== 'markdown' && value !== 'html' && value !== 'whatsapp') return 'plain';
            return value;
        }

        function onCopyFormatChange() {
            try {
                localStorage.setItem('copyFormat', getCopyFormat());
                saveStudioDefaults();
            } catch (e) {}
        }

        function initCopyFormat() {
            var saved = 'plain';
            try { saved = localStorage.getItem('copyFormat') || 'plain'; } catch (e) {}
            if (saved !== 'plain' && saved !== 'markdown' && saved !== 'html' && saved !== 'whatsapp') saved = 'plain';
            var select = document.getElementById('copyFormatSelect');
            if (select) select.value = saved;
        }

        function nodePlainText(node) {
            return (node && (node.innerText || node.textContent) || '').replace(/\u00A0/g, ' ').trim();
        }

        function buildMarkdownFromOutput(outputBox) {
            var parts = [];
            Array.prototype.forEach.call(outputBox.children, function (child) {
                if (child.classList && child.classList.contains('placeholder')) return;
                if (child.classList && child.classList.contains('code-block')) {
                    var langEl = child.querySelector('.code-lang');
                    var codeEl = child.querySelector('code');
                    var lang = langEl ? nodePlainText(langEl).toLowerCase() : '';
                    var code = codeEl ? (codeEl.textContent || '') : nodePlainText(child);
                    parts.push('```' + lang + '\n' + code.replace(/\n$/, '') + '\n```');
                    return;
                }
                if (child.tagName === 'P') {
                    var html = child.innerHTML;
                    var md = html
                        .replace(/<code class="inline-code">([\s\S]*?)<\/code>/gi, function (_, code) {
                            return '`' + code.replace(/<[^>]+>/g, '') + '`';
                        })
                        .replace(/<span class="hashtag">([\s\S]*?)<\/span>/gi, '$1')
                        .replace(/<strong>([\s\S]*?)<\/strong>/gi, '**$1**')
                        .replace(/<br\s*\/?>/gi, '\n')
                        .replace(/<[^>]+>/g, '');
                    var tmp = document.createElement('textarea');
                    tmp.innerHTML = md;
                    parts.push((tmp.value || md).trim());
                }
            });
            return parts.filter(Boolean).join('\n\n');
        }

        function buildHtmlFromOutput(outputBox) {
            var clone = outputBox.cloneNode(true);
            var placeholder = clone.querySelector('.placeholder');
            if (placeholder) placeholder.remove();
            var dir = getOutputDirection();
            return '<article dir="' + dir + '" style="font-family: Cairo, sans-serif; line-height: 1.8;">\n' +
                clone.innerHTML.trim() +
                '\n</article>';
        }

        function buildWhatsAppFromOutput(outputBox) {
            var parts = [];
            Array.prototype.forEach.call(outputBox.children, function (child) {
                if (child.classList && child.classList.contains('placeholder')) return;
                if (child.classList && child.classList.contains('code-block')) {
                    var codeEl = child.querySelector('code');
                    var code = codeEl ? (codeEl.textContent || '') : nodePlainText(child);
                    parts.push('```\n' + code.replace(/\n$/, '') + '\n```');
                    return;
                }
                if (child.tagName === 'P') {
                    var text = nodePlainText(child)
                        .replace(/^#/gm, '#')
                        .replace(/\s+/g, ' ')
                        .trim();
                    if (text) parts.push(text);
                }
            });
            return parts.join('\n\n');
        }

        function getCopyPayload(outputBox, format) {
            if (format === 'markdown') return buildMarkdownFromOutput(outputBox);
            if (format === 'html') return buildHtmlFromOutput(outputBox);
            if (format === 'whatsapp') return buildWhatsAppFromOutput(outputBox);
            return nodePlainText(outputBox);
        }

        function copyText() {
            var outputBox = document.getElementById('outputText');
            if (!outputBox || outputBox.querySelector('.placeholder')) return;
            var format = getCopyFormat();
            var text = getCopyPayload(outputBox, format);
            var labels = {
                plain: 'Plain text copied!',
                markdown: 'Markdown copied!',
                html: 'HTML copied!',
                whatsapp: 'WhatsApp format copied!'
            };
            var msg = labels[format] || 'Text Copied!';

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function () {
                    showToast(msg);
                }).catch(function () {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        // Optional panel resizer — isolated so failures never break Process Text
        (function initResizer() {
            try {
                var resizer = document.getElementById('dragMe');
                var leftPanel = document.getElementById('leftPanel');
                var workspace = document.getElementById('workspace');
                if (!resizer || !leftPanel || !workspace) return;

                var isDragging = false;

                resizer.addEventListener('mousedown', function (e) {
                    if (window.matchMedia('(max-width: 900px)').matches) return;
                    isDragging = true;
                    resizer.classList.add('active');
                    document.body.style.cursor = 'col-resize';
                    document.body.style.userSelect = 'none';
                    e.preventDefault();
                });

                document.addEventListener('mousemove', function (e) {
                    if (!isDragging) return;
                    var containerRect = workspace.getBoundingClientRect();
                    var newWidthPercent = ((e.clientX - containerRect.left) / containerRect.width) * 100;
                    if (newWidthPercent < 20) newWidthPercent = 20;
                    if (newWidthPercent > 75) newWidthPercent = 75;
                    leftPanel.style.width = newWidthPercent + '%';
                });

                function stopDrag() {
                    if (!isDragging) return;
                    isDragging = false;
                    resizer.classList.remove('active');
                    document.body.style.cursor = 'default';
                    document.body.style.userSelect = 'auto';
                    try {
                        var width = leftPanel.style.width;
                        if (width) localStorage.setItem('panelWidth', width);
                    } catch (err) {}
                }

                document.addEventListener('mouseup', stopDrag);
                window.addEventListener('blur', stopDrag);
                window.addEventListener('resize', function () {
                    if (window.matchMedia('(max-width: 900px)').matches) {
                        leftPanel.style.width = '';
                        stopDrag();
                    }
                });

                try {
                    var savedWidth = localStorage.getItem('panelWidth');
                    if (savedWidth && !window.matchMedia('(max-width: 900px)').matches) {
                        leftPanel.style.width = savedWidth;
                    }
                } catch (err) {}
            } catch (err) {
                console.error('Resizer init failed', err);
            }
        })();

        (function initSmartUx() {
            try {
                var inputEl = document.getElementById('inputText');
                var pasteTimer = null;

                function isTypingTarget(el) {
                    if (!el) return false;
                    var tag = (el.tagName || '').toLowerCase();
                    return tag === 'textarea' || tag === 'input' || tag === 'select' || el.isContentEditable;
                }

                document.addEventListener('keydown', function (e) {
                    var key = e.key;
                    var meta = e.metaKey || e.ctrlKey;

                    if (key === 'Escape') {
                        if (outputEditMode) {
                            setOutputEditMode(false);
                            showToast('Edit closed');
                            e.preventDefault();
                        }
                        return;
                    }

                    if (meta && key === 'Enter') {
                        e.preventDefault();
                        processText({ fromShortcut: true });
                        return;
                    }

                    if (meta && e.shiftKey && (key === 'C' || key === 'c')) {
                        if (isTypingTarget(e.target) && !(e.target && e.target.id === 'outputText')) return;
                        if (!hasOutputContent()) return;
                        e.preventDefault();
                        copyText();
                    }
                });

                if (inputEl) {
                    inputEl.addEventListener('paste', function () {
                        if (pasteTimer) clearTimeout(pasteTimer);
                        pasteTimer = setTimeout(function () {
                            updateMetrics();
                            if (inputEl.value.trim()) processText({ fromPaste: true });
                        }, 30);
                    });

                    ['dragenter', 'dragover'].forEach(function (evt) {
                        inputEl.addEventListener(evt, function (e) {
                            e.preventDefault();
                            e.stopPropagation();
                            inputEl.classList.add('is-dragover');
                        });
                    });

                    ['dragleave', 'drop'].forEach(function (evt) {
                        inputEl.addEventListener(evt, function (e) {
                            e.preventDefault();
                            e.stopPropagation();
                            inputEl.classList.remove('is-dragover');
                        });
                    });

                    inputEl.addEventListener('drop', function (e) {
                        var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
                        if (!file) return;
                        if (!/\.txt$|\.md$|\.markdown$|\.text$/i.test(file.name) && file.type && file.type.indexOf('text') !== 0) {
                            showToast('Drop a text file');
                            return;
                        }
                        var reader = new FileReader();
                        reader.onload = function () {
                            inputEl.value = String(reader.result || '');
                            updateMetrics();
                            processText({ fromPaste: true, silentToast: true });
                            showToast('File loaded');
                        };
                        reader.onerror = function () { showToast('Could not read file'); };
                        reader.readAsText(file);
                    });
                }

                updateActionStates();
            } catch (err) {
                console.error('Smart UX init failed', err);
            }
        })();

        updateMetrics();
        initPreset();
        initCopyFormat();
        initOutputStyle();
        applyTheme(getTheme());
        initOutputFont();
        initOutputDirection();
        initOutputEdit();
        saveStudioDefaults();
        updateActionStates();

        // Google Analytics — load after idle so blocked networks never freeze the UI
        (function initAnalytics() {
            var MEASUREMENT_ID = 'G-DQGTBTJK2H';
            function loadGtag() {
                try {
                    window.dataLayer = window.dataLayer || [];
                    window.gtag = window.gtag || function () { dataLayer.push(arguments); };
                    gtag('js', new Date());
                    gtag('config', MEASUREMENT_ID);

                    var s = document.createElement('script');
                    s.async = true;
                    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + MEASUREMENT_ID;
                    s.onerror = function () { /* analytics unreachable — app keeps working */ };
                    document.head.appendChild(s);
                } catch (err) {
                    console.error('Analytics init failed', err);
                }
            }

            if ('requestIdleCallback' in window) {
                requestIdleCallback(loadGtag, { timeout: 3000 });
            } else {
                setTimeout(loadGtag, 1200);
            }
        })();
