<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siyyaq Studio | Advanced RTL Formatter</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f5f5f7;
            --surface-color: rgba(255, 255, 255, 0.85);
            --text-main: #1d1d1f;
            --text-muted: #515154;
            --border-color: #d2d2d7;
            --apple-blue: #0066cc;
            --apple-blue-hover: #004fb3;
            --panel-bg: #ffffff;
            --focus-ring: rgba(0, 102, 204, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 1550px;
            height: 100%;
            background: var(--surface-color);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 35px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* تحسين الهيدر واللوجو الاحترافي */
        .header {
            padding: 14px 28px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* لوجو مينيمال شيك يشبه تصميمات أبل */
        .logo-icon {
            width: 34px;
            height: 34px;
            background: #1d1d1f;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .logo-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .header-title h1 {
            margin: 0;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: #1d1d1f;
        }

        .header-title p {
            margin: 1px 0 0;
            font-size: 12px;
            color: var(--text-muted);
        }

        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .panel {
            padding: 18px 22px;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            height: 100%;
            box-sizing: border-box;
        }

        /* النسبة الدقيقة (32% لليسار، 68% لليمين) */
        .left-panel {
            width: 32%;
            min-width: 220px;
        }

        .right-panel {
            flex: 1;
            min-width: 320px;
        }

        /* المُحجّم (Slider) */
        .resizer {
            width: 8px;
            background-color: var(--bg-color);
            cursor: col-resize;
            display: flex;
            justify-content: center;
            align-items: center;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            transition: background-color 0.2s;
            user-select: none;
        }

        .resizer:hover, .resizer.active {
            background-color: var(--apple-blue);
        }

        .resizer-handle {
            width: 2px;
            height: 24px;
            background-color: #a1a1a6;
            border-radius: 2px;
        }

        .panel-header {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea, .output-box {
            flex: 1;
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            font-size: 14px;
            color: var(--text-main);
            box-sizing: border-box;
            resize: none;
            transition: all 0.2s;
            background: #ffffff;
            overflow-y: auto;
        }

        textarea {
            font-family: inherit;
            line-height: 1.6;
        }

        textarea:focus, button:focus {
            outline: none;
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        /* تعديل طفيف لحجم الخط والمسافات لعرض كلام أكثر بدون سكرول مبالغ فيه */
        .output-box {
            font-family: 'Cairo', sans-serif;
            font-size: 15.5px; /* تم تصغيره بشكل طفيف جداً وذكي */
            line-height: 1.85; /* مسافة مريحة للعين وبنفس الوقت توفر مساحة طولية */
            direction: rtl;
            text-align: right;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.01);
            white-space: pre-wrap;
        }

        .output-box p {
            margin-top: 0;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #f2f2f7;
        }
        .output-box p:last-child { border: none; }

        /* كود وسط النص — يُعرض كما هو LTR بدون تأثير RTL */
        .output-box .code-block {
            direction: ltr;
            text-align: left;
            unicode-bidi: isolate;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            font-size: 13px;
            line-height: 1.55;
            background: #f5f5f7;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px;
            margin: 10px 0 14px;
            overflow-x: auto;
            white-space: pre;
            color: #1d1d1f;
        }

        .output-box .code-block code {
            font-family: inherit;
            font-size: inherit;
            background: none;
            padding: 0;
            border: none;
        }

        .output-box .inline-code {
            direction: ltr;
            unicode-bidi: isolate;
            display: inline-block;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.9em;
            background: #f0f0f2;
            border: 1px solid #e5e5ea;
            border-radius: 4px;
            padding: 1px 6px;
            color: #1d1d1f;
            white-space: pre-wrap;
        }

        .output-box .code-lang {
            display: block;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        button {
            background: #f5f5f7;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 7px 14px;
            border-radius: 7px;
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        button:hover {
            background: #e5e5ea;
        }

        .btn-primary {
            background: var(--apple-blue);
            color: white;
            border-color: var(--apple-blue);
            box-shadow: 0 1px 3px rgba(0, 102, 204, 0.2);
        }

        .btn-primary:hover {
            background: var(--apple-blue-hover);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            background: rgba(29, 29, 31, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 10px 18px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: opacity 0.3s;
            display: none;
        }

        .placeholder {
            color: #86868b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-size: 14.5px;
        }
    </style>
</head>
<body>

    <div class="app-container" role="main">
        <header class="header">
            <div class="brand-logo">
                <!-- لوجو هندسي مينيمال يشبه تصميمات أبل -->
                <div class="logo-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 5h18v2H3V5zm0 6h12v2H3v-2zm0 6h18v2H3v-2z"/>
                    </svg>
                </div>
                <div class="header-title">
                    <h1>Siyyaq Studio</h1>
                    <p>The Ultimate RTL Text & Code Formatter</p>
                </div>
            </div>
            <div>
                <button type="button" class="btn-primary" id="processBtn" aria-label="Process and format the input text">Process Text</button>
            </div>
        </header>

        <div class="workspace" id="workspace">
            <!-- Left Panel (Raw Input) -->
            <section class="panel left-panel" id="leftPanel" aria-label="Raw Input Section">
                <div class="panel-header">Raw Input</div>
                <textarea id="inputText" aria-label="Input mixed text box" placeholder="Paste mixed Arabic/English text here. Code blocks stay as-is in place..."></textarea>
                <div class="actions">
                    <button type="button" id="clearBtn" aria-label="Clear input text">Clear Input</button>
                </div>
            </section>

            <!-- Slider / Resizer -->
            <div class="resizer" id="dragMe" role="separator" aria-label="Resize panels">
                <div class="resizer-handle"></div>
            </div>

            <!-- Right Panel (Organized Output) -->
            <section class="panel right-panel" aria-label="Organized Output Section">
                <div class="panel-header">
                    <span>Organized Output</span>
                    <div style="display: flex; gap: 8px;">
                        <button type="button" id="copyBtn" style="padding: 4px 10px;" aria-label="Copy organized text">Copy Text</button>
                    </div>
                </div>
                <div id="outputText" class="output-box" aria-live="polite">
                    <div class="placeholder">Structured text will appear here...</div>
                </div>
            </section>
        </div>
    </div>

    <div id="toast" class="toast" role="status">Copied Successfully!</div>

    <script>
        // Slider Logic
        const resizer = document.getElementById('dragMe');
        const leftPanel = document.getElementById('leftPanel');
        const workspace = document.getElementById('workspace');

        let isDragging = false;

        resizer.addEventListener('mousedown', (e) => {
            isDragging = true;
            resizer.classList.add('active');
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const containerRect = workspace.getBoundingClientRect();
            let newWidthPercent = ((e.clientX - containerRect.left) / containerRect.width) * 100;
            if (newWidthPercent < 20) newWidthPercent = 20;
            if (newWidthPercent > 75) newWidthPercent = 75;
            leftPanel.style.width = `${newWidthPercent}%`;
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                resizer.classList.remove('active');
                document.body.style.cursor = 'default';
                document.body.style.userSelect = 'auto';
            }
        });

        // Processing Logic — يحافظ على الكود في مكانه ويعرضه كما هو
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function applyRtlMarks(text) {
            return text.replace(/([.?!])(\s|$)/g, '$1\u200F$2');
        }

        function looksLikeCodeLine(line) {
            const t = line.trim();
            if (!t) return false;
            if (/^(```|~~~)/.test(t)) return true;
            if (/^(<!--|<!DOCTYPE|<\/?[a-zA-Z][\w:-]*)/i.test(t)) return true;
            if (/^[{}\[\]();]+$/.test(t)) return true;
            if (/^(function|const|let|var|import|export|class|return|if|else|for|while|package)\b/.test(t)) return true;
            if (/[{};]|=>|<\/?[a-zA-Z]/.test(t) && !/[\u0600-\u06FF]/.test(t)) return true;
            return false;
        }

        function isProseLine(line) {
            const t = line.trim();
            if (!t) return false;
            if (/[\u0600-\u06FF]/.test(t) && !/^(<!--|<\/?[a-zA-Z]|`{3}|~{3})/.test(t)) return true;
            if (/^[A-Za-z].*[.!?]$/.test(t) && !looksLikeCodeLine(t) && t.split(/\s+/).length > 4) return true;
            return false;
        }

        function isLanguageLabel(line) {
            return /^(HTML|CSS|JS|JavaScript|TypeScript|TS|JSON|XML|Python|Bash|Shell|SQL|PHP|C\+\+|C#|Java|Go|Rust|Swift|Kotlin)$/i.test(line.trim());
        }

        function tokenizeMixedContent(input) {
            const lines = input.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
            const segments = [];
            let i = 0;

            while (i < lines.length) {
                const startI = i;
                const line = lines[i];
                const trimmed = line.trim();

                // كتلة ``` أو ~~~
                const fenceMatch = trimmed.match(/^(```|~~~)(\S*)\s*$/);
                if (fenceMatch) {
                    const fence = fenceMatch[1];
                    const lang = fenceMatch[2] || '';
                    i++;
                    const codeLines = [];
                    while (i < lines.length && lines[i].trim() !== fence) {
                        codeLines.push(lines[i]);
                        i++;
                    }
                    if (i < lines.length) i++;
                    segments.push({ type: 'code', lang, content: codeLines.join('\n') });
                    continue;
                }

                // تسمية لغة ثم كود (مثل: HTML ثم وسم <script>...)
                if (isLanguageLabel(trimmed) && i + 1 < lines.length && looksLikeCodeLine(lines[i + 1])) {
                    const lang = trimmed;
                    i++;
                    const codeLines = [];
                    while (i < lines.length && !isProseLine(lines[i])) {
                        codeLines.push(lines[i]);
                        i++;
                    }
                    while (codeLines.length && codeLines[codeLines.length - 1].trim() === '') codeLines.pop();
                    if (codeLines.length) {
                        segments.push({ type: 'code', lang, content: codeLines.join('\n') });
                        continue;
                    }
                    // لو مفيش كود، اعتبر التسمية نص عادي
                    segments.push({ type: 'prose', content: lang });
                    continue;
                }

                // كتلة HTML/Script بدون سياج
                if (/^\s*(<!--|<!DOCTYPE\b|<(script|style|html|head|body|div|pre|code)\b)/i.test(line)) {
                    const codeLines = [];
                    while (i < lines.length && !isProseLine(lines[i])) {
                        codeLines.push(lines[i]);
                        i++;
                    }
                    while (codeLines.length && codeLines[codeLines.length - 1].trim() === '') codeLines.pop();
                    segments.push({ type: 'code', lang: '', content: codeLines.join('\n') });
                    continue;
                }

                // نص عادي — اجمع حتى كود قادم
                const proseLines = [];
                while (i < lines.length) {
                    const next = lines[i];
                    const nextTrim = next.trim();
                    if (/^(```|~~~)\S*\s*$/.test(nextTrim)) break;
                    if (isLanguageLabel(nextTrim) && i + 1 < lines.length && looksLikeCodeLine(lines[i + 1])) break;
                    if (/^\s*(<!--|<!DOCTYPE\b|<(script|style|html|head|body)\b)/i.test(next)) break;
                    proseLines.push(next);
                    i++;
                }
                if (proseLines.length) {
                    segments.push({ type: 'prose', content: proseLines.join('\n') });
                }

                // حماية من التجمّد: لو السطر الحالي متعالجش، خده كنص وامشي
                if (i === startI) {
                    segments.push({ type: 'prose', content: line });
                    i++;
                }
            }

            return segments;
        }

        function formatInlineCode(text) {
            const parts = text.split(/(`[^`\n]+`)/g);
            return parts.map(part => {
                if (part.length >= 2 && part.startsWith('`') && part.endsWith('`')) {
                    return `<code class="inline-code">${escapeHtml(part.slice(1, -1))}</code>`;
                }
                return escapeHtml(applyRtlMarks(part));
            }).join('');
        }

        function renderCodeBlock(lang, content) {
            const langLabel = lang ? `<span class="code-lang">${escapeHtml(lang)}</span>` : '';
            return `<pre class="code-block" dir="ltr">${langLabel}<code>${escapeHtml(content)}</code></pre>`;
        }

        function renderProse(content) {
            const paragraphs = content.split(/\n{2,}/);
            let html = '';
            paragraphs.forEach(block => {
                const nonEmpty = block.split('\n').map(l => l.trim()).filter(Boolean);
                if (!nonEmpty.length) return;
                nonEmpty.forEach(line => {
                    html += `<p>${formatInlineCode(line)}</p>`;
                });
            });
            return html;
        }

        function fallbackFormat(input) {
            const formatted = applyRtlMarks(input);
            return formatted
                .split('\n')
                .filter(p => p.trim() !== '')
                .map(p => `<p>${escapeHtml(p)}</p>`)
                .join('');
        }

        function processText() {
            const inputEl = document.getElementById('inputText');
            const outputBox = document.getElementById('outputText');
            const input = inputEl ? inputEl.value : '';

            if (!input.trim()) {
                outputBox.innerHTML = '<div class="placeholder">Please insert text first...</div>';
                return;
            }

            try {
                const segments = tokenizeMixedContent(input);
                let htmlOutput = '';
                segments.forEach(seg => {
                    if (seg.type === 'code') htmlOutput += renderCodeBlock(seg.lang, seg.content);
                    else htmlOutput += renderProse(seg.content);
                });
                outputBox.innerHTML = htmlOutput || fallbackFormat(input);
            } catch (err) {
                console.error(err);
                outputBox.innerHTML = fallbackFormat(input);
                showToast('Processed with basic formatter');
            }
        }

        function clearText() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').innerHTML = '<div class="placeholder">Structured text will appear here...</div>';
        }

        function copyText() {
            const outputBox = document.getElementById('outputText');
            if (outputBox.querySelector('.placeholder')) return;
            const text = outputBox.innerText;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => showToast('Text Copied!')).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showToast('Text Copied!');
            } catch (e) {
                showToast('Copy failed');
            }
            document.body.removeChild(ta);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        document.getElementById('processBtn').addEventListener('click', processText);
        document.getElementById('clearBtn').addEventListener('click', clearText);
        document.getElementById('copyBtn').addEventListener('click', copyText);
    </script>

</body>
</html>
