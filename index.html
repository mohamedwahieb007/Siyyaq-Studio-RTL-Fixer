<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siyyaq Studio | Advanced RTL Formatter</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f5f5f7;
            --surface-color: rgba(255, 255, 255, 0.85);
            --text-main: #1d1d1f;
            --text-muted: #515154;
            --border-color: #d2d2d7;
            --apple-blue: #0066cc;
            --apple-blue-hover: #004fb3;
            --panel-bg: #ffffff;
            --focus-ring: rgba(0, 102, 204, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 1550px;
            height: 100%;
            background: var(--surface-color);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 35px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* تحسين الهيدر واللوجو الاحترافي */
        .header {
            padding: 14px 28px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* لوجو مينيمال شيك يشبه تصميمات أبل */
        .logo-icon {
            width: 34px;
            height: 34px;
            background: #1d1d1f;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .logo-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .header-title h1 {
            margin: 0;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: #1d1d1f;
        }

        .header-title p {
            margin: 1px 0 0;
            font-size: 12px;
            color: var(--text-muted);
        }

        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .panel {
            padding: 18px 22px;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            height: 100%;
            box-sizing: border-box;
        }

        /* النسبة الدقيقة (32% لليسار، 68% لليمين) */
        .left-panel {
            width: 32%;
            min-width: 220px;
        }

        .right-panel {
            flex: 1;
            min-width: 320px;
        }

        /* المُحجّم (Slider) */
        .resizer {
            width: 8px;
            background-color: var(--bg-color);
            cursor: col-resize;
            display: flex;
            justify-content: center;
            align-items: center;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            transition: background-color 0.2s;
            user-select: none;
        }

        .resizer:hover, .resizer.active {
            background-color: var(--apple-blue);
        }

        .resizer-handle {
            width: 2px;
            height: 24px;
            background-color: #a1a1a6;
            border-radius: 2px;
        }

        .panel-header {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea, .output-box {
            flex: 1;
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            font-size: 14px;
            color: var(--text-main);
            box-sizing: border-box;
            resize: none;
            transition: all 0.2s;
            background: #ffffff;
            overflow-y: auto;
        }

        textarea {
            font-family: inherit;
            line-height: 1.6;
        }

        textarea:focus, button:focus {
            outline: none;
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        /* تعديل طفيف لحجم الخط والمسافات لعرض كلام أكثر بدون سكرول مبالغ فيه */
        .output-box {
            font-family: 'Cairo', sans-serif;
            font-size: 15.5px; /* تم تصغيره بشكل طفيف جداً وذكي */
            line-height: 1.85; /* مسافة مريحة للعين وبنفس الوقت توفر مساحة طولية */
            direction: rtl;
            text-align: right;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.01);
            white-space: pre-wrap;
        }

        .output-box p {
            margin-top: 0;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #f2f2f7;
        }
        .output-box p:last-child { border: none; }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        button {
            background: #f5f5f7;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 7px 14px;
            border-radius: 7px;
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        button:hover {
            background: #e5e5ea;
        }

        .btn-primary {
            background: var(--apple-blue);
            color: white;
            border-color: var(--apple-blue);
            box-shadow: 0 1px 3px rgba(0, 102, 204, 0.2);
        }

        .btn-primary:hover {
            background: var(--apple-blue-hover);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            background: rgba(29, 29, 31, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 10px 18px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: opacity 0.3s;
            display: none;
        }

        .placeholder {
            color: #86868b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-size: 14.5px;
        }
    </style>
</head>
<body>

    <div class="app-container" role="main">
        <header class="header">
            <div class="brand-logo">
                <!-- لوجو هندسي مينيمال يشبه تصميمات أبل -->
                <div class="logo-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 5h18v2H3V5zm0 6h12v2H3v-2zm0 6h18v2H3v-2z"/>
                    </svg>
                </div>
                <div class="header-title">
                    <h1>Siyyaq Studio</h1>
                    <p>The Ultimate RTL Text & Code Formatter</p>
                </div>
            </div>
            <div>
                <button class="btn-primary" onclick="processText()" aria-label="Process and format the input text">Process Text</button>
            </div>
        </header>

        <div class="workspace" id="workspace">
            <!-- Left Panel (Raw Input) -->
            <section class="panel left-panel" id="leftPanel" aria-label="Raw Input Section">
                <div class="panel-header">Raw Input</div>
                <textarea id="inputText" aria-label="Input mixed text box" placeholder="Paste your mixed Arabic/English text here..."></textarea>
                <div class="actions">
                    <button onclick="clearText()" aria-label="Clear input text">Clear Input</button>
                </div>
            </section>

            <!-- Slider / Resizer -->
            <div class="resizer" id="dragMe" role="separator" aria-label="Resize panels">
                <div class="resizer-handle"></div>
            </div>

            <!-- Right Panel (Organized Output) -->
            <section class="panel right-panel" aria-label="Organized Output Section">
                <div class="panel-header">
                    <span>Organized Output</span>
                    <div style="display: flex; gap: 8px;">
                        <button style="padding: 4px 10px;" onclick="copyText()" aria-label="Copy organized text">Copy Text</button>
                    </div>
                </div>
                <div id="outputText" class="output-box" aria-live="polite">
                    <div class="placeholder">Structured text will appear here...</div>
                </div>
            </section>
        </div>
    </div>

    <div id="toast" class="toast" role="status">Copied Successfully!</div>

    <script>
        // Slider Logic
        const resizer = document.getElementById('dragMe');
        const leftPanel = document.getElementById('leftPanel');
        const workspace = document.getElementById('workspace');

        let isDragging = false;

        resizer.addEventListener('mousedown', (e) => {
            isDragging = true;
            resizer.classList.add('active');
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const containerRect = workspace.getBoundingClientRect();
            let newWidthPercent = ((e.clientX - containerRect.left) / containerRect.width) * 100;
            if (newWidthPercent < 20) newWidthPercent = 20;
            if (newWidthPercent > 75) newWidthPercent = 75;
            leftPanel.style.width = `${newWidthPercent}%`;
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                resizer.classList.remove('active');
                document.body.style.cursor = 'default';
                document.body.style.userSelect = 'auto';
            }
        });

        // Processing Logic
        function processText() {
            const input = document.getElementById('inputText').value;
            const outputBox = document.getElementById('outputText');
            
            if(!input.trim()) {
                outputBox.innerHTML = '<div class="placeholder">Please insert text first...</div>';
                return;
            }
            
            let formatted = input.replace(/([.?!])(\s|$)/g, '$1\u200F$2');
            const paragraphs = formatted.split('\n').filter(p => p.trim() !== '');
            let htmlOutput = '';
            paragraphs.forEach(p => {
                htmlOutput += `<p>${p}</p>`;
            });

            outputBox.innerHTML = htmlOutput;
        }

        function clearText() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').innerHTML = '<div class="placeholder">Structured text will appear here...</div>';
        }

        function copyText() {
            const outputBox = document.getElementById('outputText');
            if(outputBox.querySelector('.placeholder')) return;
            navigator.clipboard.writeText(outputBox.innerText).then(() => showToast("Text Copied!"));
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.style.display = "block";
            setTimeout(() => { toast.style.display = "none"; }, 2000);
        }
    </script>
</body>
</html>
